#group-options .side{width:40px;min-height:44px;display:grid;place-items:center;color:var(--forest);flex-shrink:0}
#group-options .side svg{width:24px;height:24px}
#group-options .avatar{width:30px;height:30px;display:grid;place-items:center;background:#fff;border:1px solid #dde1d8;border-radius:50%;color:#626d65}
#group-options .avatar svg{width:19px;height:19px}
#group-options .fields{padding:22px 24px 20px;display:flex;flex-direction:column;gap:20px;flex:1}
#group-options .field{display:flex;flex-direction:column;gap:10px}
#group-options .field-label{font:500 16px/1.4 Rubik,sans-serif}
#group-options .picker{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:12px 16px;border:2px solid #ced7c9;border-radius:18px;box-shadow:0 3px 0 #ced7c9;background:#fff;color:#626d65;font-size:16px;font-weight:500;text-align:right}
#group-options .picker .chevron{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#fbf2cf;color:var(--forest);flex-shrink:0}
#group-options .chevron svg{width:20px;height:20px}
#group-options .picker.filled{background:#f1f6ec;color:var(--forest);border-color:#9eb79b;box-shadow:0 3px 0 #9eb79b}
#group-options .picker.filled .chevron{background:var(--sage)}
#group-options .gender{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#group-options .gender button{height:52px;background:#fff;border:2px solid #ced7c9;border-radius:16px;box-shadow:0 3px 0 #ced7c9;font-size:16px;font-weight:500;color:#303a34}
#group-options .gender button[aria-pressed=true]{background:var(--sage);border-color:var(--forest);box-shadow:0 3px 0 var(--forest);color:var(--forest);font-weight:700}
#group-options .action{margin-top:auto;padding-top:8px}
#group-options .continue{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:54px;border:2px solid #214e3d;border-radius:16px;background:var(--forest);color:#fff;font-size:18px;font-weight:500;box-shadow:0 2px 0 #214e3d}
#group-options .continue svg{color:#f4d675;width:20px;height:20px}
#group-options .continue:disabled{background:#eef0ea;border-color:#e2e6dd;color:#87918a;box-shadow:none;cursor:default}
#group-options .continue:disabled svg{color:inherit}
#group-options .picker:active,#group-options .gender button:active{transform:translateY(3px);box-shadow:none}
#group-options .nav{min-height:64px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;border-top:1px solid #dde1d8;border-radius:22px 22px 0 0;padding:5px 6px;background:var(--ivory)}
#group-options .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:400 11px/1.4 Rubik,sans-serif;color:#626d65}
#group-options .tab>span:first-child{width:42px;height:28px;border-radius:10px;display:grid;place-items:center}
#group-options .tab svg{width:21px;height:21px;stroke-width:1.8}
#group-options .tab.active{color:var(--forest);font-weight:500}
#group-options .tab.active>span:first-child{background:var(--sage)}
#group-options .slim .top{min-height:56px;background:var(--forest);border-bottom:3px solid #e7efdf}
#group-options .slim .top h1{color:var(--ivory)}
#group-options .slim .side{color:#f4d675}
#group-options .slim .compass{display:none}
#group-options .slim .fields{padding-top:22px}
#group-options .veil{position:absolute;inset:0;background:#173b2a55;z-index:20;display:flex;align-items:flex-end}
#group-options .veil[hidden]{display:none}
#group-options .sheet{width:100%;max-height:75%;overflow:auto;background:var(--ivory);padding:16px;border-radius:24px 24px 0 0;box-shadow:0 -5px 20px #255b4615}
#group-options .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#group-options .sheet-head h2{font-size:20px;margin:0}
#group-options .close{width:44px;height:44px;background:transparent;border:0;color:var(--forest);font-size:24px}
#group-options .choices{display:flex;flex-direction:column;gap:4px}
#group-options .choice{min-height:48px;padding:10px 14px;border:0;border-radius:12px;background:transparent;color:#303a34;text-align:right;font-size:16px}
#group-options .choice:hover,#group-options .choice[aria-selected=true]{background:var(--sage)}
#group-options .status{font-size:14px;margin:8px 0 0;text-align:center}
@media(max-width:359px){#group-options .fields{padding-inline:16px}#group-options .top{padding-inline:8px}#group-options .compass{width:38px}#group-options .top h1{font-size:20px}}
@media(prefers-reduced-motion:no-preference){#group-options .picker,#group-options .gender button{transition:transform 100ms,box-shadow 100ms}}
</style>

<section data-variant="Ivory header" aria-label="Ivory header with a small existing compass">
<div class="stage"><div class="screen" lang="he" dir="rtl">
<header class="top"><span class="side"><i data-lucide="chevron-right" aria-hidden="true"></i></span><div class="title"><h1>הקבוצה שלי</h1><span class="compass" aria-hidden="true"></span></div><span class="side"><span class="avatar"><i data-lucide="user-round" aria-hidden="true"></i></span></span></header>
<div class="form-mount"></div>
</div></div>
</section>
<section data-variant="Slim green bar" aria-label="Slim forest green bar without overlapping illustration" hidden>
<div class="stage"><div class="screen slim" lang="he" dir="rtl">
<header class="top"><span class="side"><i data-lucide="chevron-right" aria-hidden="true"></i></span><div class="title"><h1>הקבוצה שלי</h1></div><span class="side"><span class="avatar"><i data-lucide="user-round" aria-hidden="true"></i></span></span></header>
<div class="form-mount"></div>
</div></div>
</section>
</div>
<template id="group-form-template">
<div class="fields">
<div class="field"><span class="field-label">תנועה</span><button type="button" class="picker" data-field="movement" aria-label="תנועה" aria-haspopup="dialog"><span class="value">בחרו תנועה</span><span class="chevron"><i data-lucide="chevron-down" aria-hidden="true"></i></span></button></div>
<div class="field"><span class="field-label">כיתה</span><button type="button" class="picker" data-field="grade" aria-label="כיתה" aria-haspopup="dialog"><span class="value">בחרו כיתה</span><span class="chevron"><i data-lucide="chevron-down" aria-hidden="true"></i></span></button></div>
<div class="field"><span class="field-label">מספר חניכים</span><button type="button" class="picker" data-field="size" aria-label="מספר חניכים" aria-haspopup="dialog"><span class="value">בחרו מספר חניכים</span><span class="chevron"><i data-lucide="chevron-down" aria-hidden="true"></i></span></button></div>
<div class="field"><span class="field-label">הרכב</span><div class="gender" role="group" aria-label="הרכב"><button type="button" aria-pressed="false">מעורב</button><button type="button" aria-pressed="false">בנים</button><button type="button" aria-pressed="false">בנות</button></div></div>
<div class="action"><button class="continue" type="button" disabled>המשך<i data-lucide="arrow-left" aria-hidden="true"></i></button><p class="status" aria-live="polite" hidden></p></div>
</div>
<nav class="nav" aria-label="תצוגת ניווט">
<div class="tab"><span><i data-lucide="house" aria-hidden="true"></i></span><span>בית</span></div>
<div class="tab active"><span><i data-lucide="sparkles" aria-hidden="true"></i></span><span>יצירה</span></div>
<div class="tab"><span><i data-lucide="book-open" aria-hidden="true"></i></span><span>מאגר</span></div>
<div class="tab"><span><i data-lucide="list-checks" aria-hidden="true"></i></span><span>הפעולות שלי</span></div>
</nav>
<div class="veil" hidden><div class="sheet" role="dialog" aria-modal="true" aria-label="בחירת פרטי קבוצה"><div class="sheet-head"><h2></h2><button class="close" aria-label="סגירה" type="button">×</button></div><div class="choices" role="listbox"></div></div></div>
</template>
<script>
(()=>{
const root=document.getElementById('group-options');
const template=document.getElementById('group-form-template');
const options={movement:["צופים", "הנוער העובד והלומד", "בני עקיבא", "מכבי צעיר", "המחנות העולים", "השומר הצעיר", "נוער לאומי ביתר", "הנוער השומר", "ארגון המד״צים", "מדריכי של״ח צעירים", "חוגי סיירות", "נוע״ם", "האיחוד החקלאי", "שינשינים", "אחר"],grade:['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ז׳','ח׳','ט׳','י׳','י״א','י״ב'].map(x=>'כיתה '+x),size:['1-5','5-10','10-20','20-30','30+']};
root.querySelectorAll('.screen').forEach(screen=>{
const mount=screen.querySelector('.form-mount');
mount.replaceWith(template.content.cloneNode(true));
const values={};let trigger=null;
const veil=screen.querySelector('.veil'), choices=screen.querySelector('.choices');
const close=()=>{veil.hidden=true;if(trigger){trigger.setAttribute('aria-expanded','false');trigger.focus();}};
const update=()=>{screen.querySelector('.continue').disabled=!['movement','grade','size','gender'].every(k=>values[k]);};
screen.querySelectorAll('.picker').forEach(button=>{
button.setAttribute('aria-expanded','false');
button.addEventListener('click',()=>{
trigger=button;const key=button.dataset.field;
screen.querySelector('.sheet-head h2').textContent=button.getAttribute('aria-label');
choices.replaceChildren();
options[key].forEach(value=>{const option=document.createElement('button');option.type='button';option.className='choice';option.setAttribute('role','option');option.setAttribute('aria-selected',String(values[key]===value));option.textContent=value;if(key==='size')option.dir='ltr';option.addEventListener('click',()=>{values[key]=value;button.querySelector('.value').textContent=value;if(key==='size')button.querySelector('.value').dir='ltr';button.classList.add('filled');update();close();});choices.append(option);});
veil.hidden=false;button.setAttribute('aria-expanded','true');screen.querySelector('.close').focus();
});
});
screen.querySelectorAll('.gender button').forEach(button=>button.addEventListener('click',()=>{values.gender=button.textContent;screen.querySelectorAll('.gender button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));update();}));
screen.querySelector('.close').addEventListener('click',close);
veil.addEventListener('click',e=>{if(e.target===veil)close();});
veil.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'){const buttons=[...veil.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
screen.querySelector('.continue').addEventListener('click',()=>{const status=screen.querySelector('.status');status.hidden=false;status.textContent='פרטי הקבוצה מוכנים';});
if(globalThis.Tweak){const state={width:390};const tweak=new Tweak({container:screen,onChange:()=>{screen.style.width=state.width+'px';}});tweak.addSlider(state,'width',{label:'Phone width',min:320,max:430,step:1,unit:'px'});}
});
if(globalThis.lucide)lucide.createIcons();
})();
</script>
