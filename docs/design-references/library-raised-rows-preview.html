<style>
#wiz-refined .stage{padding:20px 0;min-height:690px;display:flex;justify-content:center}
#wiz-refined .phone{--ivory:#faf8f1;--forest:#255b46;--sage:#e7efdf;box-sizing:border-box;width:390px;max-width:100%;height:650px;background:var(--ivory);color:#303a34;font-family:Rubik,sans-serif;direction:rtl;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;border:1px solid #dde1d8}
#wiz-refined .phone *{box-sizing:border-box}
#wiz-refined .head{height:88px;flex-shrink:0;display:grid;grid-template-columns:40px 1fr 40px;align-items:start;padding:18px 16px;background:var(--forest);color:var(--ivory)}
#wiz-refined .head h1{font:700 24px/32px Rubik,sans-serif;text-align:center;margin:0;letter-spacing:-.5px}
#wiz-refined .avatar{width:32px;height:32px;display:grid;place-items:center;border:1px solid #d4dfcf;background:#faf8f1;border-radius:50%;color:#626d65}
#wiz-refined .avatar svg{width:20px;height:20px}
#wiz-refined .content{margin-top:-16px;border-radius:24px 24px 0 0;background:var(--ivory);padding:24px 20px;flex:1}
#wiz-refined .rows{display:flex;flex-direction:column;gap:12px}
#wiz-refined .row{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 14px;background:#fff;border:2px solid #ced7c9;border-radius:16px;box-shadow:0 2px 0 #ced7c9}
#wiz-refined .label{font:500 16px/1.5 Rubik,sans-serif;color:#303a34}
#wiz-refined .thumb{width:72px;height:52px;flex-shrink:0;object-fit:cover;border-radius:10px}
#wiz-refined .bottom{height:66px;flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;border-top:1px solid #dde1d8;border-radius:22px 22px 0 0;background:var(--ivory);padding:5px 6px}
#wiz-refined .tab{display:flex;align-items:center;flex-direction:column;gap:3px;color:#626d65;font:400 11px/1.3 Rubik,sans-serif}
#wiz-refined .tab span:first-child{height:28px;width:42px;display:grid;place-items:center;border-radius:10px}
#wiz-refined .tab svg{width:21px;height:21px;stroke-width:1.8}
#wiz-refined .tab.active{color:var(--forest);font-weight:500}
#wiz-refined .tab.active span:first-child{background:var(--sage)}
#wiz-refined .quiet .head{background:var(--ivory);color:var(--forest);height:72px}
#wiz-refined .quiet .content{margin-top:0;padding-top:16px}
#wiz-refined .quiet .rows{gap:0;background:#fff;border:1px solid #dde1d8;border-radius:18px;padding:0 14px}
#wiz-refined .quiet .row{padding:12px 0;min-height:80px;border:0;border-bottom:1px solid #e5e8e0;box-shadow:none;border-radius:0}
#wiz-refined .quiet .row:last-child{border-bottom:0}
#wiz-refined .quiet .thumb{width:64px;height:48px;border-radius:9px}
@media(max-width:420px){#wiz-refined .stage{padding:12px 0}#wiz-refined .content{padding-inline:16px}}
